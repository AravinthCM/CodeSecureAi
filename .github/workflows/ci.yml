name: Node.js CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: code-secure-ai/package-lock.json

      # 🔹 Frontend
      - name: Install frontend deps
        run: npm ci
        working-directory: code-secure-ai

      - name: Run Vitest UI Tests
        run: npx vitest run
        working-directory: code-secure-ai

      - name: Build frontend
        run: npm run build
        working-directory: code-secure-ai

      # 🔹 Backend
      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Check backend
        run: npm run check
        working-directory: backend
